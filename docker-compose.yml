version: '3.7'

services:
  # NGINX / PHP
  web:
    image: webwhales/for-wp-nginx:php8.3-fpm
    hostname: vdigital.localhost
    restart: unless-stopped
    volumes:
      - ./.docker/conf/site.conf:/etc/nginx/sites-enabled/site.conf
      - ./.docker/conf/site.ini:/usr/local/etc/php/conf.d/vdigital.ini
      - ./.docker/conf/supervisor.conf:/etc/supervisor/conf.d/site.conf
      - ./.docker/logs/web_nginx:/var/log/nginx
      - ./:/var/www/html
    ports:
      - "64:80"
    links:
      - db

  # MySQL
  db:
    image: mariadb:10.3.11
    restart: unless-stopped
    volumes:
      - ./.docker/conf/mysql/docker-entrypoint-initdb.d/create_test_database.sql:/docker-entrypoint-initdb.d/create_test_database.sql
      - db_volume:/var/lib/mysql
      - ./.docker/logs/db_mysql:/var/log/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "KxxLtk8GoI0Fx7JkCWBDZQGW9CPFJjC1"
      MYSQL_DATABASE: "vdigital"
      MYSQL_USER: "vdigital"
      MYSQL_PASSWORD: "vdigital"
    ports:
      - "3315:3306"

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    hostname: vdigital-pma.localhost
    restart: unless-stopped
    volumes:
      - ./.docker/conf/phpmyadmin_config.php:/etc/phpmyadmin/config.user.inc.php
      - ./.docker/data/phpmyadmin/sessions:/sessions
      - ./.docker/data/phpmyadmin/uploads:/var/uploads
    ports:
      - "99:80"
    environment:
      PMA_ARBITRARY: "1"
      PMA_HOST: "db"
      PMA_USER: "root"
      PMA_PASSWORD: "KxxLtk8GoI0Fx7JkCWBDZQGW9CPFJjC1"
    links:
      - db

volumes:
  db_volume:
